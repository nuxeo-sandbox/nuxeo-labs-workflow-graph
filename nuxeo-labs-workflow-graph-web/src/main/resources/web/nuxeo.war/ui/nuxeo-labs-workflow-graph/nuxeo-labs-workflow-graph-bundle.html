<!--
  Entry point of the plugin, loaded by Web UI at startup (see OSGI-INF/lwg-webresources-contrib.xml).
  The scripts run in this order:

    lwg-core.js        namespace, directions, translations, text measuring, model (graph and history). Saves
                       any global "dagre" defined by another add-on, so lwg-layout.js can restore it
    vendor/dagre.min.js  dagre 3.1.3 (MIT), unmodified
    lwg-layout.js      geometry helpers and the layout, top to bottom or left to right (dagre)
    lwg-icons.js       inline SVG icons
    lwg-styles.js      CSS of the graph
    lwg-renderer.js    LWG.Renderer: drawing, zoom, pan, fit, center, keyboard
    the Polymer dialog, then lwg-override.js (patch of Web UI's nuxeo-workflow-graph.show())

  @since 2025.1
-->
<script src="lwg-core.js"></script>
<script src="vendor/dagre.min.js"></script>
<script src="lwg-layout.js"></script>
<script src="lwg-icons.js"></script>
<script src="lwg-styles.js"></script>
<script src="lwg-renderer.js"></script>

<link rel="import" href="nuxeo-labs-workflow-graph-dialog.html" />

<script src="lwg-override.js"></script>
