<!--
  `nuxeo-labs-workflow-graph-dialog`: large dialog showing the title of the workflow and its graph
  (LWG.Renderer). Created by lwg-override.js inside Web UI's nuxeo-workflow-graph element, where the default
  dialog lives, so it behaves the same way (stacking, notifications, theme).

    dialog.open(workflowId) returns a promise. When the graph cannot be fetched, the dialog closes and shows Web UI's
    usual error message. When it cannot be drawn, the dialog closes and the promise rejects with
    error.lwgFallback = true, so the caller can open Web UI's default graph instead.

  Data: one call to the operation LabsWorkflowGraph.GetWorkflowGraph (server side of the plugin, @since 2025.3),
  which returns:
    workflow   id, name, title, state and workflowModelName, as GET /api/v1/workflow/{id} (the title of the dialog,
               and the model name under which the direction is kept). Read by the server for every user who can
               open the graph, also the readers of the documents who cannot read the workflow instance.
    graph      nodes and transitions, as GET /api/v1/workflow/{id}/graph.
    history    steps already done and transitions already followed (see LWG.normalizeHistory), read from the audit of
               the first attached document that the user can read, or null (no readable document, or the audit
               cannot be read): the graph is then drawn without the history.
  The labels translated by the server use the language of Web UI.

  Direction: top to bottom by default. The direction chosen in the toolbar (or with the Down / Right arrow keys)
  is kept in the browser (localStorage), per workflow model, see LWG.directionStorageKey.

  Keyboard: the key events are not propagated outside of the dialog (Web UI global shortcuts such as "d",
  "m" or "c" must not fire while the graph has the focus), except Tab (focus trap). Escape closes the dialog.

  @since 2025.1
-->
<dom-module id="nuxeo-labs-workflow-graph-dialog">
  <template>
    <style>
      :host {
        display: block;
      }

      [hidden] {
        display: none !important;
      }

      #dialog {
        width: min(1680px, 94vw);
        height: 90vh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 14px;
        background: var(--nuxeo-box, #fff);
        color: var(--nuxeo-text-default, #3a3a54);
      }

      .body {
        flex: 1;
        min-height: 0;
        margin: 0 !important;
        padding: 0 !important;
        display: flex;
        flex-direction: column;
        font-family: var(--nuxeo-app-font, Inter, Arial, sans-serif);
      }

      .header {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 12px 10px 24px;
        border-bottom: 1px solid color-mix(in srgb, var(--nuxeo-text-default, #3a3a54) 12%, transparent);
      }

      h2 {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .close {
        appearance: none;
        -webkit-appearance: none;
        flex: 0 0 40px;
        width: 40px;
        height: 40px;
        margin: 0;
        padding: 9px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--nuxeo-text-default, #3a3a54);
        cursor: pointer;
      }

      .close:hover {
        background: color-mix(in srgb, var(--nuxeo-text-default, #3a3a54) 9%, transparent);
      }

      .close:focus-visible {
        outline: 2px solid var(--nuxeo-focus-ring-color, var(--nuxeo-primary-color, #0066ff));
        outline-offset: 1px;
      }

      .close svg {
        display: block;
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .graph {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      #canvas {
        position: absolute;
        inset: 0;
      }

      .loading {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--_lwg-bg);
        color: var(--_lwg-text-muted);
        font-size: 14px;
      }
    </style>

    <!-- params set for each opening, see _fetch; a new execution aborts the previous one -->
    <nuxeo-operation id="graphOperation" op="LabsWorkflowGraph.GetWorkflowGraph"></nuxeo-operation>

    <nuxeo-dialog
      id="dialog"
      with-backdrop
      no-cancel-on-outside-click
      aria-labelledby="title"
      on-iron-overlay-opened="_onOpened"
    >
      <div class="body">
        <div class="header">
          <h2 id="title" dir="auto">[[_title(workflow, i18n)]]</h2>
          <button
            class="close"
            type="button"
            on-click="close"
            title$="[[_t('labsWorkflowGraph.dialog.close', i18n)]]"
            aria-label$="[[_t('labsWorkflowGraph.dialog.close', i18n)]]"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              ></path>
            </svg>
          </button>
        </div>
        <div class="graph">
          <div id="canvas"></div>
          <div class="loading lwg-theme" hidden$="[[!loading]]" role="status">
            [[_t('labsWorkflowGraph.loading', i18n)]]
          </div>
        </div>
      </div>
    </nuxeo-dialog>
  </template>

  <script>
    (function () {
      'use strict';

      const LWG = window.NuxeoLabs.WorkflowGraph;

      // A failed request may reject with a plain object ({ status, message }): returns an Error carrying the flags.
      function errorWith(flags, cause) {
        const error = cause instanceof Error ? cause : new Error((cause && cause.message) || String(cause));
        Object.assign(error, flags);
        if (cause && cause !== error) {
          error.cause = cause;
        }
        return error;
      }

      // Language of Web UI ("fr-FR"...), used by the server to translate the labels, null when unknown.
      function webUiLanguage() {
        const i18n = window.nuxeo && window.nuxeo.I18n;
        const language = i18n && typeof i18n.language === 'string' ? i18n.language.trim() : '';
        return language || null;
      }

      Polymer({
        is: 'nuxeo-labs-workflow-graph-dialog',
        behaviors: [Nuxeo.I18nBehavior, Nuxeo.NotifyBehavior],

        properties: {
          workflowId: {
            type: String,
          },

          // The workflow (id, name, title, state, workflowModelName), null until loaded.
          workflow: {
            type: Object,
            value: null,
          },

          loading: {
            type: Boolean,
            value: false,
          },
        },

        ready() {
          this.$.dialog.addEventListener('keydown', (e) => this._onKeyDown(e));
        },

        /*
         * Opens the dialog and loads the graph. Resolves when the graph is drawn. Rejects (after closing the
         * dialog) when the graph cannot be fetched (Web UI's error message is shown) or drawn (error.lwgFallback).
         * An opening replaced by a newer one resolves without doing anything.
         */
        open(workflowId) {
          let renderer;
          try {
            renderer = this._ensureRenderer();
          } catch (e) {
            return Promise.reject(errorWith({ lwgFallback: true }, e));
          }
          this._loadCount = (this._loadCount || 0) + 1;
          const loadId = this._loadCount;
          const isStale = () => loadId !== this._loadCount;
          this.workflowId = workflowId;
          this.workflow = null;
          this.loading = true;
          const dialog = this.$.dialog;
          if (!dialog.opened) {
            dialog.open();
          }

          return Promise.all([this._fetch(workflowId), LWG.fontsReady()])
            .catch((e) => {
              throw errorWith({ lwgGraphError: true }, e);
            })
            .then(([data]) => {
              if (isStale()) {
                return;
              }
              const graph = data && data.graph;
              if (!graph || !Array.isArray(graph.nodes)) {
                throw errorWith({ lwgGraphError: true }, new Error('Invalid workflow graph response'));
              }
              const workflow = data.workflow && typeof data.workflow === 'object' ? data.workflow : null;
              this.workflow = workflow;
              const history = this._history(data.history);
              this._directionKey = LWG.directionStorageKey(workflow, workflowId);
              try {
                renderer.setGraph(graph, { direction: LWG.loadDirection(this._directionKey), history });
              } catch (e) {
                throw errorWith({ lwgFallback: true }, e);
              }
              this.loading = false;
            })
            .catch((error) => {
              // a newer opening aborts the request
              if (isStale()) {
                return;
              }
              this.loading = false;
              dialog.close();
              if (!error.lwgFallback) {
                this.notify({ message: this.i18n('documentPage.route.view.graph.error') });
              }
              throw error;
            });
        },

        close() {
          this.$.dialog.close();
        },

        // Calls LabsWorkflowGraph.GetWorkflowGraph: { workflow, graph, history }.
        _fetch(workflowId) {
          const operation = this.$.graphOperation;
          const params = { workflowId };
          const language = webUiLanguage();
          if (language) {
            params.language = language;
          }
          operation.params = params;
          return operation.execute();
        },

        // The history to draw (see LWG.normalizeHistory), null when the server could not read it.
        _history(history) {
          if (!history) {
            console.warn(LWG.LOG_PREFIX, 'No workflow history: no attached document can be read (see the server log)');
            return null;
          }
          if (history.truncated) {
            console.warn(LWG.LOG_PREFIX, 'Too many workflow history entries, the oldest ones are ignored');
          }
          return history;
        },

        _ensureRenderer() {
          if (!this._renderer) {
            this._renderer = new LWG.Renderer(this.$.canvas, {
              // the direction chosen in the toolbar or with the keys is kept in the browser, for the workflow model
              onDirectionChange: (direction) => LWG.saveDirection(this._directionKey, direction),
            });
          }
          return this._renderer;
        },

        _onOpened(e) {
          // ignore the events of nested overlays
          if (e.target === this.$.dialog && this._renderer) {
            this._renderer.focus();
          }
        },

        // Escape is handled by the overlay manager of Polymer (document listener, capture phase): it closes the
        // dialog whatever the focus
        _onKeyDown(e) {
          if (e.key !== 'Tab') {
            e.stopPropagation();
          }
        },

        _title(workflow) {
          const title = workflow && LWG.translateLabel(workflow.title || workflow.name);
          return title || LWG.t('labsWorkflowGraph.dialog.defaultTitle');
        },

        _t(key) {
          return LWG.t(key);
        },
      });
    })();
  </script>
</dom-module>
