<!--
  Development demo (NOT packaged): renders the sample workflows with the production renderer and layout,
  without Nuxeo nor Polymer. Serve the project root over HTTP, for example:
      python3 -m http.server 8765
  then open http://localhost:8765/dev/demo/index.html
  URL parameters: wf (serial, parallel, subWorkflow, contract, large), theme (default, dark, hyland-light,
  hyland-dark), lang (en, fr), dir (TB, LR: forces the direction instead of the one kept for the sample),
  history (on, off: shows the steps already done and the transitions already followed, on by default).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nuxeo Labs Workflow Graph - demo</title>
    <style>
      html[data-theme='default'] {
        --nuxeo-app-font: 'Inter', Arial, sans-serif;
        --nuxeo-text-default: #3a3a54;
        --nuxeo-page-background: #f5f5f5;
        --nuxeo-box: #fff;
        --nuxeo-primary-color: #0066ff;
      }
      html[data-theme='dark'] {
        --nuxeo-app-font: 'Inter', Arial, sans-serif;
        --nuxeo-text-default: #fff;
        --nuxeo-page-background: #060826;
        --nuxeo-box: #2e2e3e;
        --nuxeo-primary-color: #1f28bf;
        --nuxeo-focus-ring-color: #4d9fff;
      }
      html[data-theme='hyland-light'] {
        --nuxeo-app-font: 'Noto Sans', Arial, sans-serif;
        --nuxeo-text-default: #1a1c1e;
        --nuxeo-page-background: #f3f2f9;
        --nuxeo-box: #fff;
        --nuxeo-primary-color: #5654ac;
      }
      html[data-theme='hyland-dark'] {
        --nuxeo-app-font: 'Noto Sans', Arial, sans-serif;
        --nuxeo-text-default: #e4e0f0;
        --nuxeo-page-background: #121316;
        --nuxeo-box: #0a0b0c;
        --nuxeo-primary-color: #c3c0ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--nuxeo-app-font);
        background: var(--nuxeo-box);
        color: var(--nuxeo-text-default);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 10px 16px;
        font-size: 13px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.25);
      }
      header h1 {
        font-size: 15px;
        margin: 0 auto 0 0;
      }
      header select {
        font: inherit;
      }
      #graph {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Workflow Graph</h1>
      <label>Workflow <select id="wf"></select></label>
      <label
        >Theme
        <select id="theme">
          <option>default</option>
          <option>dark</option>
          <option>hyland-light</option>
          <option>hyland-dark</option>
        </select>
      </label>
      <label
        >Language
        <select id="lang">
          <option>en</option>
          <option>fr</option>
        </select>
      </label>
      <label
        >History
        <select id="history">
          <option>on</option>
          <option>off</option>
        </select>
      </label>
    </header>
    <div id="graph"></div>

    <script src="samples.js"></script>
    <script>
      // Same order as nuxeo-labs-workflow-graph-bundle.html
      (function () {
        const base =
          '../../nuxeo-labs-workflow-graph-web/src/main/resources/web/nuxeo.war/ui/nuxeo-labs-workflow-graph/';
        window.LWG_BASE = base;
        ['lwg-core.js', 'vendor/dagre.min.js', 'lwg-layout.js', 'lwg-icons.js', 'lwg-styles.js', 'lwg-renderer.js']
          .forEach((f) => document.write(`<script src="${base}${f}"><\/script>`));
      })();
    </script>
    <script>
      (async function () {
        const params = new URLSearchParams(location.search);
        const wfName = params.get('wf') || 'serial';
        const theme = params.get('theme') || 'default';
        const lang = params.get('lang') || 'en';
        const history = params.get('history') === 'off' ? 'off' : 'on';
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang;

        // Translations: the plugin's own bundles (as merged into Web UI's ones at deployment)
        const file = lang === 'en' ? 'messages.json' : `messages-${lang}.json`;
        const messages = await fetch(`${window.LWG_BASE}../i18n/${file}`).then((r) => r.json());
        window.nuxeo = { I18n: { language: lang, translate: (key) => messages[key] || key } };

        const LWG = window.NuxeoLabs.WorkflowGraph;
        const selects = { wf: wfName, theme, lang, history };
        const wfSelect = document.getElementById('wf');
        Object.keys(window.LWG_SAMPLES).forEach((k) => {
          const opt = document.createElement('option');
          opt.value = k;
          opt.textContent = window.LWG_SAMPLES[k].label;
          wfSelect.appendChild(opt);
        });
        Object.keys(selects).forEach((id) => {
          const s = document.getElementById(id);
          s.value = selects[id];
          s.addEventListener('change', () => {
            params.set(id, s.value);
            location.search = params.toString();
          });
        });

        const sample = window.LWG_SAMPLES[wfName];
        document.getElementById('title').textContent = LWG.translateLabel(sample.title);
        // As in the dialog: the direction is kept per workflow model (here, the sample); "dir" forces it
        const directionKey = LWG.directionStorageKey({ workflowModelName: `demo-${wfName}` }, null);
        const renderer = new LWG.Renderer(document.getElementById('graph'), {
          onDirectionChange: (direction) => LWG.saveDirection(directionKey, direction),
        });
        window.renderer = renderer;
        await LWG.fontsReady();
        renderer.setGraph(sample.graph, {
          direction: params.get('dir') || LWG.loadDirection(directionKey),
          history: history === 'on' ? sample.history : null,
        });
        document.body.dataset.ready = 'true';
      })().catch((e) => {
        console.error(e);
        document.body.dataset.error = String(e && e.stack ? e.stack : e);
      });
    </script>
  </body>
</html>
